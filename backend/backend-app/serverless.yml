# "org" ensures this Service is used with the correct Serverless Framework Access Key.
org: emprendimientonarino
# "app" enables Serverless Framework Dashboard features and sharing them with other Services.
app: emprendimiento-narino-api
service: elearning-api

package:
  patterns:
    - '!node_modules/**'
    - '!venv/**'
    - '!lambda-deployment/**'
    - '!.venv/**'
    - '!.serverless/**'
    - '!__pycache__/**'
    - '!*.log'
    - '!*.sql'

provider:
  name: aws
  runtime: python3.12
  region: us-east-1
  vpc:
    securityGroupIds:
      - sg-04cd22ea237418b42
    subnetIds:
      - subnet-00e26742dbdcefc9e
      - subnet-04779f375475262e5
  environment:
    RDS_ENDPOINT: "elearning-db.cwn4cmackagl.us-east-1.rds.amazonaws.com"
    S3_BUCKET: "elearning-archivos"
    DATABASE_URL: "postgresql+psycopg://elearning_user:Elearning2024!@elearning-db.cwn4cmackagl.us-east-1.rds.amazonaws.com:5432/elearning_narino"
    FLASK_ENV: "production"
  iamRoleStatements:
    - Effect: Allow
      Action:
        - s3:GetObject
        - s3:PutObject
        - s3:DeleteObject
        - s3:PutObjectAcl
        - s3:GetObjectAcl
        - s3:ListBucket
      Resource: 
        - "arn:aws:s3:::elearning-archivos"
        - "arn:aws:s3:::elearning-archivos/*"

functions:
  api:
    handler: src.main.lambda_handler
    description: "API principal de e-learning"
    timeout: 30
    events:
      - http:
          path: /{proxy+}
          method: any
          cors:
            origin: 'https://emprendimiento-narino.com'
            headers:
              - Content-Type
              - Authorization
              - X-Requested-With
              - Accept
              - Origin
            allowCredentials: true



plugins:
  - serverless-wsgi
  - serverless-python-requirements

custom:
  wsgi:
    app: src.main.app
  pythonRequirements:
    dockerizePip: true
