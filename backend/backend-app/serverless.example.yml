# Copiar a serverless.yml y completar variables de entorno.
# NUNCA subir serverless.yml con credenciales reales al repositorio.

org: emprendimientonarino
app: emprendimiento-narino-api
service: elearning-api

package:
  patterns:
    - '!node_modules/**'
    - '!venv/**'
    - '!lambda-deployment/**'
    - '!.venv/**'
    - '!.serverless/**'
    - '!__pycache__/**'
    - '!*.log'
    - '!*.sql'

provider:
  name: aws
  runtime: python3.12
  region: us-east-1
  vpc:
    securityGroupIds:
      - sg-XXXXXXXX
    subnetIds:
      - subnet-XXXXXXXX
      - subnet-XXXXXXXX
  environment:
    RDS_ENDPOINT: "${env:RDS_ENDPOINT}"
    S3_BUCKET: "${env:S3_BUCKET}"
    DATABASE_URL: "${env:DATABASE_URL}"
    FLASK_ENV: "production"
    OPENROUTER_API_KEY: "${env:OPENROUTER_API_KEY}"
    OPENROUTER_MODEL: "${env:OPENROUTER_MODEL, 'openai/gpt-4o-mini'}"
    SUPPORT_KB_BUCKET: "${env:SUPPORT_KB_BUCKET}"
    SUPPORT_KB_KEY: "${env:SUPPORT_KB_KEY, 'support/kb.json'}"
    SUPPORT_WHATSAPP_NUMBER: "${env:SUPPORT_WHATSAPP_NUMBER}"
    EMAIL_SENDER: "${env:EMAIL_SENDER}"
    EMAIL_APP_PASSWORD: "${env:EMAIL_APP_PASSWORD}"
    FRONTEND_URL: "${env:FRONTEND_URL}"
  iamRoleStatements:
    - Effect: Allow
      Action:
        - s3:GetObject
        - s3:PutObject
        - s3:DeleteObject
        - s3:PutObjectAcl
        - s3:GetObjectAcl
        - s3:ListBucket
      Resource:
        - "arn:aws:s3:::TU-BUCKET"
        - "arn:aws:s3:::TU-BUCKET/*"

functions:
  api:
    handler: src.main.lambda_handler
    description: "API principal de e-learning"
    timeout: 60
    events:
      - http:
          path: /{proxy+}
          method: any
          cors:
            origins:
              - 'https://emprendimiento-narino.com'
              - 'https://www.emprendimiento-narino.com'
              - 'http://localhost:5173'
              - 'http://localhost:3000'
            headers:
              - Content-Type
              - Authorization
              - X-Requested-With
              - Accept
              - Origin
            allowCredentials: true

plugins:
  - serverless-wsgi
  - serverless-python-requirements

custom:
  wsgi:
    app: src.main.app
  pythonRequirements:
    dockerizePip: false
