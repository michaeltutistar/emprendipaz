name: Dynamic Environment Deployment

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main, develop]

env:
  AWS_REGION: us-east-1
  NODE_VERSION: '18'
  PYTHON_VERSION: '3.9'

jobs:
  # Job para crear/actualizar ambiente dinámico
  deploy-environment:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    environment: 
      name: pr-${{ github.event.number }}
      url: ${{ steps.deploy.outputs.frontend_url }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Install backend dependencies
      run: |
        cd backend/backend-app
        pip install -r requirements.txt

    - name: Install frontend dependencies
      run: |
        cd frontend/frontend-app
        npm ci

    - name: Build frontend
      run: |
        cd frontend/frontend-app
        npm run build

    - name: Deploy dynamic environment
      id: deploy
      run: |
        chmod +x scripts/deploy-dynamic-environment.sh
        ./scripts/deploy-dynamic-environment.sh ${{ github.event.number }}

    - name: Comment PR with environment URLs
      uses: actions/github-script@v7
      with:
        script: |
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });
          
          const botComment = comments.find(comment => 
            comment.user.type === 'Bot' && 
            comment.body.includes('🚀 **Ambiente Dinámico Desplegado**')
          );
          
          const commentBody = `🚀 **Ambiente Dinámico Desplegado**
          
          **Frontend:** ${{ steps.deploy.outputs.frontend_url }}
          **Backend API:** ${{ steps.deploy.outputs.backend_url }}
          **Database:** Ambiente temporal creado
          
          **Comandos útiles:**
          \`\`\`bash
          # Probar endpoints
          curl ${{ steps.deploy.outputs.backend_url }}/api/health
          
          # Ver logs del backend
          aws logs tail /aws/lambda/elearning-backend-pr-${{ github.event.number }} --follow
          \`\`\`
          
          **Nota:** Este ambiente será eliminado automáticamente cuando se cierre el PR.`;

          if (botComment) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: botComment.id,
              body: commentBody
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: commentBody
            });
          }

  # Job para limpiar ambiente cuando se cierra el PR
  cleanup-environment:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    
    steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Cleanup dynamic environment
      run: |
        chmod +x scripts/cleanup-dynamic-environment.sh
        ./scripts/cleanup-dynamic-environment.sh ${{ github.event.number }}

    - name: Comment PR cleanup
      uses: actions/github-script@v7
      with:
        script: |
          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            body: `🧹 **Ambiente Dinámico Eliminado**
            
            Todos los recursos del ambiente PR-${{ github.event.number }} han sido eliminados:
            - ✅ Lambda functions
            - ✅ S3 buckets
            - ✅ CloudFront distributions
            - ✅ Database connections
            
            Gracias por usar el ambiente dinámico! 🎉`
          });
