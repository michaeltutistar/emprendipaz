name: Dynamic Environment Deployment

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

env:
  AWS_REGION: us-east-1
  NODE_VERSION: '18'
  PYTHON_VERSION: '3.9'

jobs:
  deploy-environment:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    environment: 
      name: pr-${{ github.event.number }}
      url: ${{ steps.deploy.outputs.frontend_url }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Deploy dynamic environment
      id: deploy
      run: |
        chmod +x scripts/deploy-dynamic-environment.sh
        ./scripts/deploy-dynamic-environment.sh ${{ github.event.number }}

    - name: Comment PR with environment details
      uses: actions/github-script@v7
      with:
        script: |
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });
          
          const botComment = comments.find(comment => 
            comment.user.type === 'Bot' && 
            comment.body.includes('🚀 **Ambiente Dinámico Desplegado**')
          );
          
          const commentBody = `🚀 **Ambiente Dinámico Desplegado**
          
          **Frontend URL**: ${{ steps.deploy.outputs.frontend_url }}
          **Backend URL**: ${{ steps.deploy.outputs.backend_url }}
          **Environment ID**: pr-${{ github.event.number }}
          
          Este ambiente será eliminado automáticamente cuando se cierre este PR.`;
          
          if (botComment) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: botComment.id,
              body: commentBody
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: commentBody
            });
          }

  cleanup-environment:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Cleanup dynamic environment
      run: |
        chmod +x scripts/cleanup-dynamic-environment.sh
        ./scripts/cleanup-dynamic-environment.sh ${{ github.event.number }}

    - name: Comment PR with cleanup confirmation
      uses: actions/github-script@v7
      with:
        script: |
          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            body: `🧹 **Ambiente Dinámico Eliminado**
            
            El ambiente dinámico para este PR ha sido eliminado exitosamente.
            Todos los recursos AWS han sido limpiados.`
          });
